<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basalto</title>
<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="estilos.css">

</head>
<body class="bg-slate-950 font-sans">


  <div id="principal">

    <header id="inicio" class="bg-slate-900 text-white p-6 flex flex-col items-center justify-center text-center">

      <video class="video-fondo" autoplay muted loop playsinline>
        <source src="Media/video.mp4" type="video/mp4">
      </video>

      <div class="contenido-header max-w-4xl px-4">
        <button
          type="button"
          onclick="smoothScrollTo('destino', 1400, this)"
          class="titulo-wrapper text-7xl sm:text-9xl font-extrabold tracking-tight bg-transparent border-none p-0 cursor-pointer active:scale-95 focus:outline-none transition-transform duration-300"
        >
          <span class="titulo-hueco">Basalto</span>
          <span class="titulo-hueco-hover">Basalto</span>
        </button>
        <p class="text-xl sm:text-3xl mt-6 font-medium titulo-hueco2 leading-relaxed">
          Donde las buenas bases se convierten en grandes saltos.
        </p>
      </div>

    </header>

    <section id="destino" class="seccion-destino">
      <div class="destino-contenedor">

        <h2 class="destino-titulo">Por dónde <span>empezamos?</span></h2>

        <div class="tarjetas">

          <button type="button" class="tarjeta tarjeta-boton" data-ir="base">
            <span class="tarjeta-frase">BASE</span>
            <span class="tarjeta-flecha">←</span>
          </button>

          <button type="button" class="tarjeta tarjeta-boton" data-ir="salto">
            <span class="tarjeta-frase">SALTO</span>
            <span class="tarjeta-flecha">→</span>
          </button>

        </div>

      </div>
    </section>

  </div>
  


  
  <section id="panel-base" class="panel panel-izq" aria-hidden="true">
    <button type="button" class="volver" data-volver>Volver →</button>
    <div class="panel-contenido">
      <h2>BASE</h2>
      <p>Acá va el contenido de BASE.</p>
    </div>
  </section>

  <section id="panel-salto" class="panel panel-der" aria-hidden="true">
    <button type="button" class="volver" data-volver>← Volver</button>
    <div class="panel-contenido">
      <h2>SALTO</h2>
      <p>Acá va el contenido de SALTO.</p>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
