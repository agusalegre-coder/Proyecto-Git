<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basalto</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  function smoothScrollTo(id, duration = 1200, triggerEl = null) {
    const target = document.getElementById(id);
    if (!target) return;

    const startY = window.scrollY;
    const targetY = target.getBoundingClientRect().top + startY;
    const distance = targetY - startY;
    let startTime = null;

    if (triggerEl) triggerEl.classList.add('forzar-hover');

    function easeInOutQuad(t) {
      return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    }

    function step(currentTime) {
      if (startTime === null) startTime = currentTime;
      const elapsed = currentTime - startTime;
      const progress = Math.min(elapsed / duration, 1);
      window.scrollTo(0, startY + distance * easeInOutQuad(progress));
      if (progress < 1) {
        requestAnimationFrame(step);
      } else if (triggerEl) {

        triggerEl.classList.remove('forzar-hover');
      }
    }

    requestAnimationFrame(step);
  }

  
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.titulo-hueco').forEach((el) => {
      el.addEventListener('animationend', (e) => {
        if (e.animationName === 'zoomIn') {
          el.style.animation = 'moverDegradado 7s linear infinite';
        }
      });
    });
  });
</script>

<link rel="stylesheet" href="estilos.css">

</head>
<body class="bg-slate-950 font-sans">


  <header class="bg-slate-900 text-white p-6 flex flex-col items-center justify-center text-center">

    <video class="video-fondo" autoplay muted loop playsinline>
      <source src="Media/video.mp4" type="video/mp4">
    </video>

    <div class="contenido-header max-w-4xl px-4">
      <button
        type="button"
        onclick="smoothScrollTo('destino', 1400, this)"
        class="titulo-wrapper text-7xl sm:text-9xl font-extrabold tracking-tight bg-transparent border-none p-0 cursor-pointer active:scale-95 focus:outline-none transition-transform duration-300"
      >
        <span class="titulo-hueco">Basalto</span>
        <span class="titulo-hueco-hover">Basalto</span>
      </button>
      <p class="text-xl sm:text-3xl mt-6 font-medium titulo-hueco2 leading-relaxed">
        Donde las buenas bases se convierten en grandes saltos.
      </p>
    </div>

  </header>

  <section id="destino" class="min-h-screen">
<div class="cuadro">
Pruebas

</div>


  </section>

</body>
</html>
