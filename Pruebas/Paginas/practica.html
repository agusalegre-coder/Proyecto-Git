<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Práctica</title>
<style>

body {
    background-color: #37373a;
    height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

@keyframes moverDegradado { 

    0% {
        background-position: 0% 50%;
    }
    100% {
        background-position: 300% 50%;
    }
}

@keyframes aparecer {
from {
    opacity:0;
    transform: scale(0.7);
    }

to {
    opacity:1;
    transform: scale(1);
    }
}

h1 {
  text-align:center;
  font-size: 120px;
  margin: 0;
  animation:aparecer 1s ease-out, moverDegradado 4s linear infinite;

  background: linear-gradient(90deg, #f57904, #fce4b0, #f57904, #fce4b0, #f57904);
  background-size: 300% 100%;
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;  
}

</style>
</head>

<body>
<h1>Proposito</h1>
</body>
</html>
